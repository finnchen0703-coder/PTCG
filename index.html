<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 卡牌鑑定管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; max-width: 500px; margin: 0 auto; }
        .btn { background: #3ecf8e; color: white; padding: 15px 20px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold;}
        #status { margin-top: 20px; color: #666; font-weight: bold; }
        #result { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; display: none; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        .panel { margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🎴 AI 卡牌掃描儀</h1>
    
    <input type="file" accept="image/*" capture="camera" id="fileInput" style="display:none">
    <button class="btn" onclick="document.getElementById('fileInput').click()">📷 拍照辨識卡牌</button>

    <div id="status">準備就緒</div>
    <hr style="margin: 30px 0; border: 1px solid #ddd;">

    <!-- 4. 我的收藏區塊 -->
    <h2>🗂️ 我的卡本</h2>
    <button class="btn" style="background: #007bff;" onclick="loadCollection()">📖 載入我的收藏</button>
    
    <!-- 這裡用來顯示資料庫撈出來的卡片列表 -->
    <div id="collection-container" style="margin-top: 20px; display: none;">
        <table id="collection-table" style="width: 100%; border-collapse: collapse; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">
            <thead style="background: #333; color: white;">
                <tr>
                    <th style="padding: 10px; text-align: left;">卡片名稱</th>
                    <th style="padding: 10px; text-align: left;">編號</th>
                    <th style="padding: 10px; text-align: left;">狀態/評級</th>
                </tr>
            </thead>
            <tbody id="collection-body">
                <!-- 資料會由 JavaScript 動態塞入這裡 -->
            </tbody>
        </table>
    </div>
    <div id="result"></div>

    <div id="save-section" class="panel" style="display:none;">
        <h3 style="margin-top: 0;">📊 步驟二：設定收藏狀態</h3>
        
        <label>鑑定公司：</label>
        <select id="grade-vendor">
            <option value="Raw">無 (裸卡)</option>
            <option value="PSA">PSA</option>
            <option value="BGS">BGS</option>
            <option value="CGC">CGC</option>
        </select>

        <label>分數：</label>
        <select id="grade-score">
            <option value="10">10</option>
            <option value="9.5">9.5</option>
            <option value="9">9</option>
            <option value="8">8</option>
            <option value="7">7 及以下</option>
        </select>

        <button class="btn" style="background: #28a745;" onclick="saveToDatabase()">✅ 辨識正確，存入圖鑑</button>
        <button class="btn" style="background: #dc3545;" onclick="location.reload()">❌ 辨識錯誤，重新拍攝</button>
    </div>

    <script>
        // ⚠️ 請填入你的專案資訊
        const SUPABASE_URL = 'https://ddwamjhkxxogleqstncx.supabase.co'; // 你的 URL
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkd2FtamhreHhvZ2xlcXN0bmN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MDY5OTUsImV4cCI6MjA4OTE4Mjk5NX0.xKcYy9ZQlZl3W9BCDsmKicVm1qshb_QbcmjT1yMD1Lw'; // 你的 KEY

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const saveSection = document.getElementById('save-section');

        // 全域變數，用來暫存準備寫入資料庫的資料
        let currentCardData = null; 
        let currentFileName = "";    

        // === 動作一：拍照與辨識 ===
        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = "🚀 正在上傳照片...";
            resultDiv.style.display = "none";
            saveSection.style.display = "none";

            try {
                currentFileName = `scan_${Date.now()}.jpg`;

                // 1. 上傳照片
                const { error: uploadError } = await db.storage
                    .from('card-images')
                    .upload(currentFileName, file);
                if (uploadError) throw uploadError;

                // 2. 取得網址並呼叫 AI
                const { data: { publicUrl } } = db.storage.from('card-images').getPublicUrl(currentFileName);
                statusDiv.innerText = "🧠 AI 正在鑑定中...";

                const { data, error: funcError } = await db.functions.invoke('identify-card', {
                    body: { imageUrl: publicUrl }
                });
                if (funcError) throw funcError;

                // 3. 顯示結果並彈出儲存面板
                currentCardData = data; 
                statusDiv.innerText = "✅ 鑑定完成！請確認資訊。";
                
                resultDiv.innerHTML = `
                    <h3 style="margin-top: 0;">📝 鑑定報告：</h3>
                    <p><b>名稱：</b> ${data.name || '未知'}</p>
                    <p><b>編號：</b> ${data.card_code || '未知'}</p>
                    <p><b>語言：</b> ${data.language || '未知'}</p>
                `;
                resultDiv.style.display = "block";
                saveSection.style.display = "block"; // 顯示儲存按鈕

            } catch (err) {
                console.error(err);
                alert("出錯了：" + (err.message || "未知錯誤"));
                statusDiv.innerText = "❌ 發生錯誤";
            }
        };

        // === 動作二：寫入資料庫並刪除照片 ===
        async function saveToDatabase() {
            statusDiv.innerText = "💾 正在寫入資料庫與清理空間...";
            saveSection.style.display = "none"; // 先隱藏按鈕防連點

            try {
                // 1. 檢查主圖鑑 (card_master) 有沒有這張卡，沒有就新增
                let { data: card, error: cardError } = await db
                    .from('card_master')
                    .select('id')
                    .eq('card_code', currentCardData.card_code)
                    .single();

                let cardId;
                if (!card) {
                    const { data: newCard, error: insertError } = await db
                        .from('card_master')
                        .insert({
                            name: currentCardData.name,
                            card_code: currentCardData.card_code,
                            language: currentCardData.language
                        })
                        .select()
                        .single();
                    if (insertError) throw insertError;
                    cardId = newCard.id;
                } else {
                    cardId = card.id;
                }

                // 2. 寫入用戶收藏 (user_collections)
                const vendor = document.getElementById('grade-vendor').value;
                const score = document.getElementById('grade-score').value;
                
                const { error: collectError } = await db.from('user_collections').insert({
                    card_id: cardId,
                    status: vendor === 'Raw' ? 'raw' : 'graded',
                    grade_vendor: vendor === 'Raw' ? null : vendor,
                    grade_score: vendor === 'Raw' ? null : parseFloat(score),
                    quantity: 1
                });
                if (collectError) throw collectError;

                // 3. 自動刪除 Storage 中的照片
                const { error: deleteError } = await db.storage
                    .from('card-images')
                    .remove([currentFileName]);
                if (deleteError) console.warn("照片刪除失敗，但不影響存檔", deleteError);

                alert("🎉 成功！卡片已加入圖鑑，雲端照片已清理完畢。");
                location.reload(); // 重整頁面，準備掃描下一張

            } catch (err) {
                console.error(err);
                alert("儲存失敗：" + err.message + "\n(請確認資料庫 RLS 權限已開啟)");
                saveSection.style.display = "block"; // 失敗的話把按鈕顯示回來
                statusDiv.innerText = "❌ 儲存失敗";
            }
        }
        // === 動作三：載入並顯示收藏 (使用 JOIN) ===
        async function loadCollection() {
            const container = document.getElementById('collection-container');
            const tbody = document.getElementById('collection-body');
            const statusDiv = document.getElementById('status');
            
            statusDiv.innerText = "⏳ 正在從資料庫撈取收藏...";
            tbody.innerHTML = ""; // 清空舊資料
            container.style.display = "block";

            try {
                // 這裡就是 Supabase 的 JOIN 語法！
                // 我們從 user_collections 出發，順便把關聯的 card_master 資料抓出來
                const { data, error } = await db
                    .from('user_collections')
                    .select(`
                        id,
                        status,
                        grade_vendor,
                        grade_score,
                        card_master (
                            name,
                            card_code,
                            language
                        )
                    `)
                    .order('id', { ascending: false }); // 新增的排在最上面

                if (error) throw error;

                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3' style='padding: 15px; text-align: center;'>目前還沒有收藏喔！趕快去掃描吧。</td></tr>";
                    statusDiv.innerText = "✅ 載入完成";
                    return;
                }

                // 把撈出來的資料一筆一筆變成表格的 HTML
                data.forEach(item => {
                    const card = item.card_master; // 這是 JOIN 過來的圖鑑資料
                    
                    // 處理評級顯示文字
                    let gradeText = "裸卡 (Raw)";
                    if (item.status === 'graded') {
                        gradeText = `<span style="background:#ffd700; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:12px;">${item.grade_vendor} ${item.grade_score}</span>`;
                    }

                    // 建立表格的列 (Row)
                    const row = `
                        <tr style="border-bottom: 1px solid #eee;">
                            <td style="padding: 12px;"><b>${card.name}</b> <br><small style="color:#666;">${card.language}</small></td>
                            <td style="padding: 12px; color:#555;">${card.card_code}</td>
                            <td style="padding: 12px;">${gradeText}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                statusDiv.innerText = "✅ 收藏載入完成！";

            } catch (err) {
                console.error("載入收藏失敗:", err);
                alert("載入收藏失敗：" + err.message);
                statusDiv.innerText = "❌ 載入失敗";
            }
        }
    </script>
</body>
</html>

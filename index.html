<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 卡牌鑑定管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; max-width: 500px; margin: 0 auto; }
        .btn { background: #3ecf8e; color: white; padding: 15px 20px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold;}
        #status { margin-top: 20px; color: #666; font-weight: bold; }
        #result { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; display: none; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        .panel { margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🎴 AI 卡牌掃描儀</h1>
    
    <input type="file" accept="image/*" capture="camera" id="fileInput" style="display:none">
    <button class="btn" onclick="document.getElementById('fileInput').click()">📷 拍照辨識卡牌</button>

    <div id="status">準備就緒</div>
    <hr style="margin: 30px 0; border: 1px solid #ddd;">

    <!-- 4. 我的收藏區塊 -->
    <h2>🗂️ 我的卡本</h2>
    <button class="btn" style="background: #007bff;" onclick="loadCollection()">📖 載入我的收藏</button>
    
    <!-- 這裡用來顯示資料庫撈出來的卡片列表 -->
    <div id="collection-container" style="margin-top: 20px; display: none;">
        <table id="collection-table" style="width: 100%; border-collapse: collapse; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">
            <thead style="background: #333; color: white;">
                <tr>
                    <th style="padding: 10px; text-align: left;">卡片名稱</th>
                    <th style="padding: 10px; text-align: left;">編號</th>
                    <th style="padding: 10px; text-align: left;">狀態/評級</th>
                </tr>
            </thead>
            <tbody id="collection-body">
                <!-- 資料會由 JavaScript 動態塞入這裡 -->
            </tbody>
        </table>
    </div>
    <div id="result"></div>

    <div id="save-section" class="panel" style="display:none;">
        <h3 style="margin-top: 0;">📊 步驟二：設定收藏狀態</h3>
        
        <label>鑑定公司：</label>
        <select id="grade-vendor">
            <option value="Raw">無 (裸卡)</option>
            <option value="PSA">PSA</option>
            <option value="BGS">BGS</option>
            <option value="CGC">CGC</option>
        </select>

        <label>分數：</label>
        <select id="grade-score">
            <option value="10">10</option>
            <option value="9.5">9.5</option>
            <option value="9">9</option>
            <option value="8">8</option>
            <option value="7">7 及以下</option>
        </select>

        <button class="btn" style="background: #28a745;" onclick="saveToDatabase()">✅ 辨識正確，存入圖鑑</button>
        <button class="btn" style="background: #dc3545;" onclick="location.reload()">❌ 辨識錯誤，重新拍攝</button>
    </div>

    <script>
        // ⚠️ 請填入你的專案資訊
        const SUPABASE_URL = 'https://ddwamjhkxxogleqstncx.supabase.co'; // 你的 URL
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkd2FtamhreHhvZ2xlcXN0bmN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MDY5OTUsImV4cCI6MjA4OTE4Mjk5NX0.xKcYy9ZQlZl3W9BCDsmKicVm1qshb_QbcmjT1yMD1Lw'; // 你的 KEY

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const saveSection = document.getElementById('save-section');

        // 全域變數，用來暫存準備寫入資料庫的資料
        let currentCardData = null; 
        let currentFileName = "";    

        // === 動作一：拍照與辨識 ===
        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = "🚀 正在上傳照片...";
            resultDiv.style.display = "none";
            saveSection.style.display = "none";

            try {
                currentFileName = `scan_${Date.now()}.jpg`;

                // 1. 上傳照片
                const { error: uploadError } = await db.storage
                    .from('card-images')
                    .upload(currentFileName, file);
                if (uploadError) throw uploadError;

                // 2. 取得網址並呼叫 AI
                const { data: { publicUrl } } = db.storage.from('card-images').getPublicUrl(currentFileName);
                statusDiv.innerText = "🧠 AI 正在鑑定中...";

                const { data, error: funcError } = await db.functions.invoke('identify-card', {
                    body: { imageUrl: publicUrl }
                });
                if (funcError) throw funcError;

                // 3. 顯示結果並彈出儲存面板
                currentCardData = data; 
                statusDiv.innerText = "✅ 鑑定完成！請確認資訊。";
                
                resultDiv.innerHTML = `
                    <h3 style="margin-top: 0;">📝 鑑定報告：</h3>
                    <p><b>名稱：</b> ${data.name || '未知'}</p>
                    <p><b>編號：</b> ${data.card_code || '未知'}</p>
                    <p><b>語言：</b> ${data.language || '未知'}</p>
                `;
                resultDiv.style.display = "block";
                saveSection.style.display = "block"; // 顯示儲存按鈕

            } catch (err) {
                console.error(err);
                alert("出錯了：" + (err.message || "未知錯誤"));
                statusDiv.innerText = "❌ 發生錯誤";
            }
        };

        // === 動作二：寫入資料庫並刪除照片 ===
        async function saveToDatabase() {
            statusDiv.innerText = "💾 正在寫入資料庫與清理空間...";
            saveSection.style.display = "none"; // 先隱藏按鈕防連點

            try {
                // 1. 檢查主圖鑑 (card_master) 有沒有這張卡，沒有就新增
                let { data: card, error: cardError } = await db
                    .from('card_master')
                    .select('id')
                    .eq('card_code', currentCardData.card_code)
                    .single();

                let cardId;
                if (!card) {
                    const { data: newCard, error: insertError } = await db
                        .from('card_master')
                        .insert({
                            name: currentCardData.name,
                            card_code: currentCardData.card_code,
                            language: currentCardData.language
                        })
                        .select()
                        .single();
                    if (insertError) throw insertError;
                    cardId = newCard.id;
                } else {
                    cardId = card.id;
                }

                // 2. 寫入用戶收藏 (user_collections)
                const vendor = document.getElementById('grade-vendor').value;
                const score = document.getElementById('grade-score').value;
                
                const { error: collectError } = await db.from('user_collections').insert({
                    card_id: cardId,
                    status: vendor === 'Raw' ? 'raw' : 'graded',
                    grade_vendor: vendor === 'Raw' ? null : vendor,
                    grade_score: vendor === 'Raw' ? null : parseFloat(score),
                    quantity: 1
                });
                if (collectError) throw collectError;

                // 3. 自動刪除 Storage 中的照片
                const { error: deleteError } = await db.storage
                    .from('card-images')
                    .remove([currentFileName]);
                if (deleteError) console.warn("照片刪除失敗，但不影響存檔", deleteError);

                alert("🎉 成功！卡片已加入圖鑑，雲端照片已清理完畢。");
                location.reload(); // 重整頁面，準備掃描下一張

            } catch (err) {
                console.error(err);
                alert("儲存失敗：" + err.message + "\n(請確認資料庫 RLS 權限已開啟)");
                saveSection.style.display = "block"; // 失敗的話把按鈕顯示回來
                statusDiv.innerText = "❌ 儲存失敗";
            }
        }
        // === 動作三：載入並顯示收藏 (使用 JOIN) ===
        // ==========================================
        // ⬇️ 收藏庫專用功能區塊 (支援篩選與市值計算) ⬇️
        // ==========================================

        let allCachedData = []; // 建立一個全域變數，用來把撈下來的資料存放在瀏覽器記憶體中

        // 1. 載入收藏列表 (只負責從雲端抓資料)
        // === 動作三：載入收藏列表 (加入強固的價格防錯機制) ===
        async function loadCollection() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "⏳ 正在從資料庫撈取收藏與最新市場價格...";
            
            try {
                const { data, error } = await db
                    .from('user_collections')
                    .select(`
                        id, status, grade_vendor, grade_score,
                        card_master (
                            name, card_code, language,
                            price_history (
                                price,
                                created_at
                            )
                        )
                    `)
                    .order('id', { ascending: false });

                if (error) throw error;

                // 進行安全資料轉換
                allCachedData = data.map(item => {
                    const card = item.card_master;
                    
                    // 💡 防錯機制 1：如果 card_master 或是 price_history 是空的，自動給予空陣列 []
                    const history = card?.price_history ?? [];
                    
                    let latestPrice = 0;

                    // 💡 防錯機制 2：只有在確實有歷史價格資料時，才進行排序與撈取
                    if (history.length > 0) {
                        // 複製一份陣列進行排序，避免更動原始資料
                        const sortedHistory = [...history].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                        
                        // 確保撈出來的 price 有數值，如果寫入時不小心是 null，則安全轉為 0
                        latestPrice = sortedHistory[0]?.price ?? 0;
                    }

                    return {
                        ...item,
                        price: latestPrice // 就算完全沒有價格紀錄，這裡也會安全地回傳 0
                    };
                });

                document.getElementById('collection-container').style.display = "block";
                statusDiv.innerText = "✅ 載入完成！";
                
                // 呼叫原本的繪製畫面函式
                renderTable(); 

            } catch (err) {
                console.error("載入失敗:", err);
                alert("載入收藏失敗：" + err.message);
                statusDiv.innerText = "❌ 載入失敗";
            }
        }

        // 2. 處理篩選條件並繪製畫面 (負責計算與顯示)
        function renderTable() {
            const tbody = document.getElementById('collection-body');
            const vendorFilter = document.getElementById('filter-vendor').value;
            const scoreFilter = document.getElementById('filter-score').value;
            
            tbody.innerHTML = ""; // 清空舊畫面

            // --- 篩選邏輯 ---
            let filteredData = allCachedData.filter(item => {
                // 檢查鑑定公司/狀態
                let passVendor = true;
                if (vendorFilter === 'Raw') passVendor = (item.status === 'raw');
                else if (vendorFilter !== 'ALL') passVendor = (item.grade_vendor === vendorFilter);

                // 檢查分數
                let passScore = true;
                if (scoreFilter === '10') passScore = (item.grade_score == 10);
                else if (scoreFilter === '9') passScore = (item.grade_score >= 9);

                return passVendor && passScore; // 兩個條件都符合才保留
            });

            // --- 計算總價值與數量 ---
            let totalValue = 0;
            filteredData.forEach(item => {
                totalValue += (item.price || 0); // 確保沒有價格時視為 0
            });
            
            document.getElementById('total-cards').innerText = `${filteredData.length} 張`;
            document.getElementById('total-value').innerText = `$${totalValue.toLocaleString()}`;

            // --- 繪製表格 ---
            if (filteredData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4' style='padding: 15px; text-align: center;'>沒有符合篩選條件的卡片。</td></tr>";
                return;
            }

            filteredData.forEach(item => {
                const card = item.card_master; 
                let gradeText = "裸卡 (Raw)";
                if (item.status === 'graded') {
                    gradeText = `<span style="background:#ffd700; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:12px;">${item.grade_vendor} ${item.grade_score}</span>`;
                }

                const vendorArg = item.grade_vendor ? `'${item.grade_vendor}'` : `'Raw'`;
                const scoreArg = item.grade_score ? item.grade_score : 10;
                const currentPrice = item.price || 0;

                const row = `
                    <tr id="row-${item.id}" style="border-bottom: 1px solid #eee;">
                        <td style="padding: 12px;"><b>${card.name}</b> <br><small style="color:#666;">${card.card_code} | ${card.language}</small></td>
                        <td style="padding: 12px;" id="status-cell-${item.id}">${gradeText}</td>
                        <td style="padding: 12px; color: #28a745; font-weight: bold;" id="price-cell-${item.id}">$${currentPrice.toLocaleString()}</td>
                        <td style="padding: 12px; text-align: center;" id="action-cell-${item.id}">
                            <button onclick="enterEditMode('${item.id}', '${item.status}', ${vendorArg}, ${scoreArg}, ${currentPrice})" style="background:#ffc107; color:black; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">✏️ 修改</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // 3. 切換進入編輯模式 (新增價格修改框)
        function enterEditMode(id, currentStatus, currentVendor, currentScore, currentPrice) {
            const statusCell = document.getElementById(`status-cell-${id}`);
            const priceCell = document.getElementById(`price-cell-${id}`);
            const actionCell = document.getElementById(`action-cell-${id}`);

            statusCell.innerHTML = `
                <select id="edit-vendor-${id}" style="width:100%; padding:5px; margin-bottom:5px;">
                    <option value="Raw" ${currentStatus === 'raw' ? 'selected' : ''}>無 (裸卡)</option>
                    <option value="PSA" ${currentVendor === 'PSA' ? 'selected' : ''}>PSA</option>
                    <option value="BGS" ${currentVendor === 'BGS' ? 'selected' : ''}>BGS</option>
                    <option value="CGC" ${currentVendor === 'CGC' ? 'selected' : ''}>CGC</option>
                </select>
                <select id="edit-score-${id}" style="width:100%; padding:5px;">
                    <option value="10" ${currentScore == 10 ? 'selected' : ''}>10</option>
                    <option value="9.5" ${currentScore == 9.5 ? 'selected' : ''}>9.5</option>
                    <option value="9" ${currentScore == 9 ? 'selected' : ''}>9</option>
                    <option value="8" ${currentScore == 8 ? 'selected' : ''}>8</option>
                    <option value="7" ${currentScore == 7 ? 'selected' : ''}>7及以下</option>
                </select>
            `;

            // 替換為輸入框讓使用者打價格
            priceCell.innerHTML = `<input type="number" id="edit-price-${id}" value="${currentPrice}" style="width: 80%; padding: 5px;">`;

            actionCell.innerHTML = `
                <button onclick="saveUpdate('${id}')" style="background:#28a745; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-weight:bold; margin-bottom:5px;">💾 儲存</button><br>
                <button onclick="renderTable()" style="background:#6c757d; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">❌ 取消</button>
            `;
        }

        // 4. 儲存更新到雲端 (包含價格)
        async function saveUpdate(id) {
            const vendor = document.getElementById(`edit-vendor-${id}`).value;
            const score = document.getElementById(`edit-score-${id}`).value;
            const priceInput = document.getElementById(`edit-price-${id}`).value;
            
            const isRaw = (vendor === 'Raw');
            const newPrice = parseInt(priceInput) || 0; // 轉為數字

            document.getElementById('status').innerText = "⚡ 正在同步更新至雲端...";

            try {
                const { error } = await db
                    .from('user_collections')
                    .update({
                        status: isRaw ? 'raw' : 'graded',
                        grade_vendor: isRaw ? null : vendor,
                        grade_score: isRaw ? null : parseFloat(score),
                        price: newPrice // 寫入新價格
                    })
                    .eq('id', id);

                if (error) throw error;

                // 為了讓畫面最快更新，我們可以直接更新記憶體裡的資料，不用重新撈資料庫
                let index = allCachedData.findIndex(item => item.id == id);
                if (index !== -1) {
                    allCachedData[index].status = isRaw ? 'raw' : 'graded';
                    allCachedData[index].grade_vendor = isRaw ? null : vendor;
                    allCachedData[index].grade_score = isRaw ? null : parseFloat(score);
                    allCachedData[index].price = newPrice;
                }

                alert("🎉 更新成功！");
                document.getElementById('status').innerText = "✅ 狀態已同步";
                renderTable(); // 直接根據新資料重新畫表格

            } catch (err) {
                console.error("更新失敗:", err);
                alert("更新失敗：" + err.message);
                renderTable();
            }
        }
    </script>
</body>
</html>
